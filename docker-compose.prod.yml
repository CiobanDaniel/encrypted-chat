services:
  securechat-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: ghcr.io/${GITHUB_OWNER:-your-org}/securechat-server:latest
    container_name: securechat-server
    restart: unless-stopped
    expose:
      - "65432"
    environment:
      SECURECHAT_SERVER_BIND_HOST: 0.0.0.0
      SECURECHAT_SERVER_BIND_PORT: 65432
      SECURECHAT_BUFFER_SIZE: ${SECURECHAT_BUFFER_SIZE:-4096}
    networks:
      - securechat-net

  securechat-proxy:
    image: haproxy:2.9
    container_name: securechat-proxy
    restart: unless-stopped
    depends_on:
      - securechat-server
    ports:
      - "${SECURECHAT_PUBLIC_PORT:-65432}:65432"
    volumes:
      - ./deploy/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - securechat-net

networks:
  securechat-net:
    driver: bridge
