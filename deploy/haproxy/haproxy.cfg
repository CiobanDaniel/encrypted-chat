global
    log stdout format raw local0
    maxconn 20000

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend securechat_front
    bind *:65432
    mode tcp
    # Basic anti-abuse: limit bursty new connections per source IP.
    stick-table type ip size 200k expire 10m store conn_rate(10s),conn_cur
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc_conn_rate(0) gt 100 }
    default_backend securechat_back

backend securechat_back
    mode tcp
    balance roundrobin
    option tcp-check
    server securechat_server securechat-server:65432 check maxconn 5000
